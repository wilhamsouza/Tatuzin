server {
    server_name painel.tatuzin.com.br;

    root /var/www/tatuzin-owner-current;
    index index.html;

    location ^~ /_releases/ {
        alias /var/www/tatuzin-owner-releases/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/(flutter_bootstrap\.js|flutter\.js|main\.dart\.js|flutter_service_worker\.js|version\.json|release\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|wasm|json|woff|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/painel.tatuzin.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/painel.tatuzin.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = painel.tatuzin.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name painel.tatuzin.com.br;
    return 404; # managed by Certbot


}