server {
  server_name admin.tatuzin.com.br;

  root /var/www/tatuzin-admin-current;
  index index.html;

  location ^~ /_releases/ {
    alias /var/www/tatuzin-admin-releases/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location = /index.html { add_header Cache-Control "no-store" always; }
  location ~ ^/(flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|version\.json|release\.json)$ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.tatuzin.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.tatuzin.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = admin.tatuzin.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name admin.tatuzin.com.br;
    return 404; # managed by Certbot


}