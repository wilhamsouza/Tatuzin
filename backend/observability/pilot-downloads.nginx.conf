# Include only inside the HTTPS server for api.tatuzin.com.br.
# Exact public files; this directory must never contain signing keys or backups.
location = /downloads/tatuzin-1.0.2-piloto-2.apk {
    alias /var/www/tatuzin-pilot/tatuzin-1.0.2-piloto-2.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="tatuzin-1.0.2-piloto-2.apk"' always;
    add_header Cache-Control 'no-cache' always;
}
location = /downloads/tatuzin-1.0.2-piloto-2.sha256 {
    alias /var/www/tatuzin-pilot/tatuzin-1.0.2-piloto-2.sha256;
    default_type text/plain;
    add_header Cache-Control 'no-cache' always;
}
