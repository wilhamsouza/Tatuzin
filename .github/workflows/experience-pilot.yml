name: Experience pilot APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experience-pilot-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORG_GRADLE_PROJECT_tatuzinPilot: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Restore test-only signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tatuzin-pilot-signing-v1
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - name: Verify critical pilot flows
        run: flutter test --no-pub test/app_navigation_shell_test.dart test/onboarding_test.dart test/checkout_discount_test.dart test/product_form_page_test.dart test/company_experience_profile_test.dart test/product_journey_test.dart
      - name: Build isolated test APK
        run: >-
          flutter build apk --release --no-pub
          --target-platform android-arm,android-arm64,android-x64
          --build-name 1.0.1 --build-number "${GITHUB_RUN_NUMBER}"
          --dart-define=TATUZIN_APP_VERSION=1.0.1-pilot
      - name: Verify pilot package
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | head -n 1)"
          test "$("$APKANALYZER" manifest application-id "$APK")" = br.com.tatuzin.gestao.pilot
          test "$("$APKANALYZER" manifest debuggable "$APK")" = false
          cp "$APK" build/tatuzin-1.0.1-pilot.apk
          cd build
          sha256sum tatuzin-1.0.1-pilot.apk > SHA256SUMS
          printf 'Source: %s\nVersion: 1.0.1-pilot\nPackage: br.com.tatuzin.gestao.pilot\nSigning: Android test certificate; not a Play Store release\n' "$GITHUB_SHA" > PILOT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tatuzin-experience-pilot-apk
          path: |
            build/tatuzin-1.0.1-pilot.apk
            build/SHA256SUMS
            build/PILOT.txt
          retention-days: 30
          if-no-files-found: error
