name: Experience pilot APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experience-pilot-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORG_GRADLE_PROJECT_tatuzinPilot: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - name: Verify critical pilot flows
        run: flutter test --no-pub test/widget_test.dart test/sale_customer_assignment_test.dart test/app_migrations_schema_test.dart test/app_navigation_shell_test.dart test/onboarding_test.dart test/checkout_discount_test.dart test/product_form_page_test.dart test/company_experience_profile_test.dart test/product_journey_test.dart
      - name: Build isolated test APK
        run: >-
          flutter build apk --release --no-pub
          --target-platform android-arm,android-arm64,android-x64
          --build-name 1.0.2 --build-number "${GITHUB_RUN_NUMBER}"
          --dart-define=TATUZIN_APP_VERSION=1.0.2-pilot
      - name: Verify pilot package
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | head -n 1)"
          test "$("$APKANALYZER" manifest application-id "$APK")" = br.com.tatuzin.gestao.pilot2
          test "$("$APKANALYZER" manifest debuggable "$APK")" = false
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            echo 'The CI candidate must be unsigned; signing belongs to the protected host.'
            exit 1
          fi
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          "$ZIPALIGN" -P 16 -f 4 "$APK" build/tatuzin-1.0.2-pilot2-unsigned.apk
          cd build
          sha256sum tatuzin-1.0.2-pilot2-unsigned.apk > SHA256SUMS
          printf 'Source: %s\nVersion: 1.0.2-pilot\nPackage: br.com.tatuzin.gestao.pilot2\nSigning: UNSIGNED CANDIDATE - protected host signing required\n' "$GITHUB_SHA" > PILOT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tatuzin-pilot2-unsigned-candidate
          path: |
            build/tatuzin-1.0.2-pilot2-unsigned.apk
            build/SHA256SUMS
            build/PILOT.txt
          retention-days: 30
          if-no-files-found: error
