# Exemplo de Nginx para publicar o owner_web como Flutter Web estático.
# Ajuste root, SSL e headers conforme o servidor real.
# Não configure proxy para /api aqui: o app chama https://api.tatuzin.com.br/api
# via TATUZIN_OWNER_API_URL no build.

server {
    listen 80;
    server_name painel.tatuzin.com.br;

    root /var/www/tatuzin/owner_web;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|wasm|json|woff|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
